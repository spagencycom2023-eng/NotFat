<title>NotFat</title>
<style>
:root{color-scheme:dark;--bg:#282b30;--card:#181b22;--card2:#20242d;--text:#f2f4f8;--mute:#8b93a3;--accent:#a9e62a;--accent-ink:#1b2a05;--danger:#f87171;--line:#2a2f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:800;margin:2px 0}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:var(--text);background:var(--card2);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;width:100%;padding:16px;font-size:18px}
button.danger{color:var(--danger)}.vid{background:var(--card2);color:var(--accent);text-decoration:none;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
button.small{padding:6px 10px;font-size:14px}
button:active{transform:scale(.98)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.between{justify-content:space-between}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--mute)}
.alert{background:#4a3a0a;color:#fde68a;border-radius:12px;padding:12px;margin-bottom:12px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:14px 4px;color:var(--mute);font-size:14px}
nav button.on{color:var(--accent);font-weight:700}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set input{width:100%;background:var(--card2);border:1px solid transparent;color:var(--text);border-radius:10px;padding:10px;font:inherit;text-align:center}
.set input:focus{outline:2px solid var(--accent)}
.set .chk{padding:0;height:42px;font-size:20px}.set .chk.done{background:var(--accent);color:var(--accent-ink)}
.set.done input{opacity:.6}
.hint{font-size:12px;color:var(--mute);text-align:center}
.timer{position:fixed;inset-inline:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:0 6px 20px #0006;max-width:536px;margin-inline:auto}
.timer .t{font-size:26px;flex:1}.timer button{background:#0002;color:inherit;padding:8px 12px}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px;max-height:80vh;overflow:auto}
.opt{display:block;width:100%;text-align:start;margin-bottom:6px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
input.f,textarea.f{width:100%;background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sm{width:70px;text-align:center}
</style>
</head>

  { title:"אני בונה לבד", desc:"מתחילים מאפס ומוסיפים אימונים ותרגילים בעצמי", days:[{name:"אימון 1",ex:[]}]}
];
function buildProgram(t){ return t.days.map((d,i)=>({ id:d.id||("d"+Date.now()+i), name:d.name, ex:d.ex.map(n=>toEx(catBy[n])) })); }
const KEY = "gym.v1";

/* ---------- מצב ושמירה ---------- */
const blank = () => ({ program:null, next:null, history:[], draft:null, settings:{ rest:90, remindDays:3 }, lastNotif:0 });
function load(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch{}
  const s=Object.assign(blank(),d);
  if(!s.program && (s.history.length||s.draft)){ s.program=buildProgram(TEMPLATES[0]); s.next=["A","B","C"].includes(s.next)?s.next:"A"; } // מעבר מגרסה ישנה
  if(s.program && !s.program.some(x=>x.id===s.next)) s.next=s.program[0]?.id??null;
  return s;
}
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
let view = "home";            // home | workout | program | history | settings
let timer = null;

/* ---------- עזרים ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => new Date(t).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
const daysSince = t => Math.floor((Date.now()-t)/864e5);
const dayIdx = id => S.program.findIndex(d=>d.id===id);
const dayById = id => S.program?.find(d=>d.id===id);
const labelOf = i => String.fromCharCode(65+(i%26));
const nextOf = id => { const i=dayIdx(id); return S.program[(i<0?0:(i+1)%S.program.length)].id; };
function lastOf(name){
  for (const h of S.history) { const e = h.exercises.find(x=>x.name===name); if (e) { const sets = e.sets.filter(s=>s.done); if (sets.length) return sets; } }
  return null;
}
const lastText = sets => sets ? "בפעם הקודמת: " + sets.map(s=>`${s.weight||"-"}×${s.reps||"-"}`).join(" · ") : "אין נתון קודם";
const newSets = (n, prev) => Array.from({length:n},(_,i)=>({weight:prev?.[i]?.weight??prev?.[prev.length-1]?.weight??"",reps:"",done:false}));
function makeExercise(e){ const prev=lastOf(e.name); return { name:e.name, muscle:e.muscle||"", target:e.reps||"-", equip:e.equip||"", sets:newSets(Math.max(1,+e.sets||3),prev) }; }
function startWorkout(id){
  const day=dayById(id); if(!day) return;
  S.draft = { dayId:id, key:labelOf(dayIdx(id)), name:day.name, started:Date.now(), exercises:day.ex.map(makeExercise) };
  save(); view="workout"; render();
}

/* ---------- טיימר מנוחה ---------- */
function startRest(sec){ timer = { end: Date.now() + (sec ?? S.settings.rest)*1000, beeped:false }; renderTimer(); }
function renderTimer(){
  const el = $("timer");
  if (!timer || view!=="workout") { el.innerHTML=""; return; }
  const left = Math.max(0, Math.ceil((timer.end-Date.now())/1000));
  if (left===0 && !timer.beeped) { timer.beeped = true; try{navigator.vibrate?.([300,150,300]);}catch{} beep(); }
  const m = Math.floor(left/60), s = String(left%60).padStart(2,"0");
  el.innerHTML = `<div class="timer"><span>מנוחה</span><span class="t">${left===0?"לעבודה! 💪":m+":"+s}</span>
    <button onclick="adj(-15)">-15</button><button onclick="adj(15)">+15</button><button onclick="timer=null;renderTimer()">✕</button></div>`;
}
function adj(d){ if(timer){ timer.end += d*1000; timer.beeped=false; renderTimer(); } }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.2; o.start(); setTimeout(()=>{o.stop();a.close();},400);}catch{} }
setInterval(()=>{ if(timer) renderTimer(); },500);

/* ---------- תצוגות ---------- */
function render(){
  if (!S.program) { $("nav").innerHTML=""; $("timer").innerHTML=""; $("app").innerHTML=vOnboard(); return; }
  if (view==="workout" && !S.draft) view="home";
  $("nav").innerHTML = [["home","🏠","בית"],["workout","🏋️","אימון"],["program","📋","תוכנית"],["history","📅","היסטוריה"],["settings","⚙️","הגדרות"]]
    .map(([k,i,t])=>`<button class="${view===k?"on":""}" onclick="go('${k}')">${i}<br>${t}</button>`).join("");
  $("app").innerHTML = ({home:vHome,workout:vWorkout,program:vProgram,history:vHistory,settings:vSettings})[view]();
  renderTimer();
}
function go(v){ if(v==="workout" && !S.draft){ if(!S.next) return go("program"); startWorkout(S.next); return; } view=v; render(); window.scrollTo(0,0); }

function vOnboard(){
  return `<div style="text-align:center"><img src="logo.png" alt="NotFat" style="width:160px;height:160px;border-radius:28px"></div>
  <h1 style="text-align:center">ברוכים הבאים</h1>
  <div class="mute" style="text-align:center;margin-bottom:14px">איך נראית תוכנית האימונים שלך? בחר נקודת התחלה. אפשר לשנות הכול אחר כך.</div>`+
  TEMPLATES.map((t,i)=>`<button class="card opt" onclick="pickTemplate(${i})"><b>${esc(t.title)}</b><div class="mute">${esc(t.desc)}</div></button>`).join("");
}
function pickTemplate(i){
  S.program=buildProgram(TEMPLATES[i]); S.next=S.program[0].id; save();
  view = TEMPLATES[i].days[0].ex.length ? "home" : "program"; render(); window.scrollTo(0,0);
}

function vHome(){
  const day = dayById(S.next), last = S.history[0];
  if(!day) return `<h1>NotFat</h1><div class="card">אין אימונים בתוכנית. <button class="primary" onclick="go('program')">בנה תוכנית</button></div>`;
  const gap = last ? daysSince(last.finished) : null;
  const alert = gap!==null && gap>=S.settings.remindDays ? `<div class="alert">⏰ עברו ${gap} ימים מאז האימון האחרון. הגיע הזמן להתאמן!</div>` : "";
  const lab = labelOf(dayIdx(day.id));
  return `<div style="text-align:center"><img src="logo.png" alt="NotFat" style="width:180px;height:180px;border-radius:28px"></div>${alert}
  <div class="card"><div class="mute">האימון הבא שלך</div>
    <div class="big">אימון ${lab} · ${esc(day.name)}</div>
    <div class="mute" style="margin:6px 0 14px">${last?`אימון אחרון: ${esc(last.key)} · ${fmtDate(last.finished)}`:"עוד לא רשמת אימון"}${day.ex.length?"":" · אין תרגילים באימון הזה (הוסף בלשונית תוכנית)"}</div>
    <button class="primary" onclick="${S.draft?"go('workout')":`startWorkout('${day.id}')`}">${S.draft?"המשך אימון "+esc(S.draft.key):"התחל אימון "+lab}</button>
    <div class="mute" style="margin-top:12px;text-align:center">האימון הבא יתקדם רק אחרי שתסמן "סיימתי אימון".</div></div>
  <div class="card"><h2>לשנות את האימון הבא?</h2><div class="row" style="flex-wrap:wrap">${S.program.map((d,i)=>
    `<button class="grow ${S.next===d.id?"primary":""}" style="${S.next===d.id?"width:auto;font-size:16px;padding:12px":""}" onclick="setNext('${d.id}')">${labelOf(i)}<br><span style="font-size:12px">${esc(d.name)}</span></button>`).join("")}</div></div>`;
}
function setNext(id){ if(S.draft && (S.draft.dayId||S.draft.key)!==id && !confirm("יש אימון פתוח. להמשיך בלי לשנות אותו?")) return; S.next=id; save(); render(); }

function vWorkout(){
  const d = S.draft;
  return `<h1>אימון ${esc(d.key)} · ${esc(d.name||"")}</h1>` + d.exercises.map((e,i)=>`
  <div class="card"><div class="row between"><div><b>${esc(e.name)}</b><div class="mute">${esc(e.muscle)}${e.equip?" · "+esc(e.equip):""} · יעד: ${e.sets.length}×${esc(e.target)}</div></div>
    <div class="row"><a class="vid" href="${videoUrl(e.name)}" target="_blank" rel="noopener">▶ סרטון</a><button class="small" onclick="swapEx(${i})">החלף</button></div></div>
    <div class="hint" style="text-align:start;margin-top:6px">${lastText(lastOf(e.name))}</div>
    <div class="set hint"><span></span><span>משקל (ק"ג)</span><span>חזרות</span><span></span></div>
    ${e.sets.map((s,j)=>`<div class="set ${s.done?"done":""}"><span class="mute">${j+1}</span>
      <input inputmode="decimal" placeholder="0" value="${esc(s.weight)}" oninput="upd(${i},${j},'weight',this.value)">
      <input inputmode="numeric" placeholder="0" value="${esc(s.reps)}" oninput="upd(${i},${j},'reps',this.value)">
      <button class="chk ${s.done?"done":""}" onclick="tick(${i},${j})">✓</button></div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="small" onclick="addSet(${i})">+ סט</button>
      ${e.sets.length>1?`<button class="small" onclick="delSet(${i})">- סט</button>`:""}<span class="grow"></span>
      <button class="small danger" onclick="delEx(${i})">הסר</button></div></div>`).join("") +
  `<button class="card" style="width:100%" onclick="addEx()">+ הוסף תרגיל</button>
   <button class="primary" onclick="finish()">✅ סיימתי אימון ${esc(d.key)}</button>
   <button class="danger" style="width:100%;margin-top:10px" onclick="cancelWorkout()">בטל אימון (בלי לקדם)</button>`;
}
function upd(i,j,f,v){ S.draft.exercises[i].sets[j][f]=v; save(); }
function tick(i,j){ const s=S.draft.exercises[i].sets[j]; s.done=!s.done; save(); render(); if(s.done) startRest(); }
function addSet(i){ const e=S.draft.exercises[i]; const l=e.sets[e.sets.length-1]; e.sets.push({weight:l?.weight??"",reps:"",done:false}); save(); render(); }
function delSet(i){ S.draft.exercises[i].sets.pop(); save(); render(); }
function delEx(i){ if(confirm("להסיר את התרגיל?")){ S.draft.exercises.splice(i,1); save(); render(); } }

/* בוחר תרגילים (חיפוש בספרייה + תרגיל משלי) */
let _pick = null, _list = [];
function pickExercise(title, onPick, exclude){
  _pick = onPick; window._ex = exclude||[];
  $("modal").innerHTML = `<div class="sheet" onclick="if(event.target===this)closeModal()"><div><h2>${esc(title)}</h2>
   <input class="f" id="q" placeholder="חיפוש (למשל: חזה, כבלים, סקוואט)" oninput="pickFilter()">
   <div id="plist" style="margin-top:10px"></div>
   <button class="opt" onclick="customEx()">✏️ תרגיל משלי…</button><button class="opt" onclick="closeModal()">סגור</button></div></div>`;
  pickFilter();
}
function pickFilter(){
  const q=($("q")?.value||"").trim().toLowerCase();
  _list = CAT.filter(r=>!window._ex.includes(r[0]) && (!q || (r[0]+" "+r[1]+" "+r[4]).toLowerCase().includes(q)));
  $("plist").innerHTML = _list.map((r,n)=>`<button class="opt" onclick="pickIdx(${n})"><b>${esc(r[0])}</b><div class="mute">${esc(r[1])} · ${esc(r[4])} · ${r[2]}×${esc(r[3])}</div></button>`).join("") || `<div class="mute">לא נמצא. אפשר להוסיף "תרגיל משלי".</div>`;
}
function pickIdx(n){ const cb=_pick; closeModal(); cb(toEx(_list[n])); }
function customEx(){
  const name = (prompt("שם התרגיל:")||"").trim(); if(!name) return;
  const cb=_pick; closeModal(); cb({ name, muscle:"מותאם אישית", sets:3, reps:"8-12", equip:"" });
}
function closeModal(){ $("modal").innerHTML=""; }
function addEx(){ pickExercise("הוסף תרגיל", ex=>{ S.draft.exercises.push(makeExercise(ex)); save(); render(); }, S.draft.exercises.map(e=>e.name)); }
function swapEx(i){ pickExercise("החלף תרגיל", ex=>{ S.draft.exercises[i]=makeExercise(ex); save(); render(); }, S.draft.exercises.map(e=>e.name)); }

function finish(){
  const d=S.draft;
  const ex = d.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  if(!ex.length){ alert("לא סימנת אף סט כבוצע (✓). סמן סטים שעשית כדי לשמור."); return; }
  const nid = nextOf(d.dayId||d.key), nd = dayById(nid);
  if(!confirm(`לשמור את אימון ${d.key} ולעבור לאימון ${labelOf(dayIdx(nid))} (${nd.name})?`)) return;
  S.history.unshift({ id:Date.now(), key:d.key, name:d.name, started:d.started, finished:Date.now(), exercises:ex });
  S.next = nid; S.draft=null; timer=null; save(); view="home"; render(); window.scrollTo(0,0);
}
function cancelWorkout(){ if(confirm("לבטל את האימון הנוכחי? האימון הבא לא יתקדם.")){ S.draft=null; timer=null; save(); view="home"; render(); } }

/* ---------- עורך תוכנית ---------- */
function vProgram(){
  return `<h1>התוכנית שלי</h1><div class="mute" style="margin-bottom:12px">כאן אתה קובע את האימונים, התרגילים, הסטים והחזרות. האימונים מתחלפים לפי הסדר שכאן.</div>` +
  S.program.map((d,di)=>`<div class="card">
    <div class="row"><span class="pill">${labelOf(di)}</span><input class="f grow" value="${esc(d.name)}" onchange="renameDay(${di},this.value)">
      <button class="small" onclick="moveDay(${di},-1)">↑</button><button class="small" onclick="moveDay(${di},1)">↓</button></div>
    ${d.ex.map((e,ei)=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">
      <div class="row between"><div><b>${esc(e.name)}</b><div class="mute">${esc(e.muscle||"")}${e.equip?" · "+esc(e.equip):""}</div></div>
        <div class="row"><button class="small" onclick="moveEx(${di},${ei},-1)">↑</button><button class="small" onclick="moveEx(${di},${ei},1)">↓</button><button class="small danger" onclick="delProgEx(${di},${ei})">✕</button></div></div>
      <div class="row" style="margin-top:6px"><span class="mute">סטים</span><input class="f sm" inputmode="numeric" value="${esc(e.sets)}" onchange="setProgEx(${di},${ei},'sets',this.value)">
        <span class="mute">חזרות</span><input class="f sm" value="${esc(e.reps)}" onchange="setProgEx(${di},${ei},'reps',this.value)"></div></div>`).join("")}
    <div class="row" style="margin-top:12px"><button class="grow" onclick="addProgEx(${di})">+ הוסף תרגיל</button><button class="danger" onclick="delDay(${di})">מחק אימון</button></div></div>`).join("") +
  `<button class="primary" onclick="addDay()">+ הוסף יום אימון</button>`;
}
function renameDay(di,v){ S.program[di].name=v.trim()||S.program[di].name; save(); render(); }
function moveDay(di,dir){ const j=di+dir; if(j<0||j>=S.program.length) return; [S.program[di],S.program[j]]=[S.program[j],S.program[di]]; save(); render(); }
function addDay(){ S.program.push({ id:"d"+Date.now(), name:"אימון "+(S.program.length+1), ex:[] }); save(); render(); }
function delDay(di){
  if(S.program.length<2) return alert("חייב להישאר לפחות אימון אחד.");
  if(!confirm(`למחוק את "${S.program[di].name}"? ההיסטוריה נשמרת.`)) return;
  const [rm]=S.program.splice(di,1); if(S.next===rm.id) S.next=S.program[Math.min(di,S.program.length-1)].id; save(); render();
}
function addProgEx(di){ pickExercise("הוסף תרגיל לאימון", ex=>{ S.program[di].ex.push(ex); save(); render(); }, S.program[di].ex.map(e=>e.name)); }
function delProgEx(di,ei){ S.program[di].ex.splice(ei,1); save(); render(); }
function moveEx(di,ei,dir){ const a=S.program[di].ex, j=ei+dir; if(j<0||j>=a.length) return; [a[ei],a[j]]=[a[j],a[ei]]; save(); render(); }
function setProgEx(di,ei,f,v){ const e=S.program[di].ex[ei]; if(f==="sets"){ const n=parseInt(v,10); if(n>0&&n<=20) e.sets=n; } else e.reps=v.trim()||e.reps; save(); render(); }

function vHistory(){
  if(!S.history.length) return `<h1>היסטוריה</h1><div class="card mute">עוד אין אימונים. סיים אימון ראשון והוא יופיע כאן.</div>`;
  return `<h1>היסטוריה</h1>` + S.history.map(h=>`<div class="card"><div class="row between"><div><b>אימון ${esc(h.key)} · ${esc(h.name||dayById(h.key)?.name||"")}</b>
    <div class="mute">${fmtDate(h.finished)}</div></div><button class="small danger" onclick="delHist(${h.id})">מחק</button></div>
    ${h.exercises.map(e=>`<div style="margin-top:10px"><b>${esc(e.name)}</b><div class="mute">${e.sets.map(s=>`${s.weight||"-"}×${s.reps||"-"}`).join(" · ")}</div></div>`).join("")}</div>`).join("");
}
function delHist(id){ if(confirm("למחוק את האימון מההיסטוריה? (האימון הבא לא ישתנה)")){ S.history=S.history.filter(h=>h.id!==id); save(); render(); } }

function vSettings(){
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  return `<h1>הגדרות</h1><div class="card">
   <label>זמן מנוחה בין סטים (שניות)</label><input class="f" type="number" inputmode="numeric" value="${S.settings.rest}" onchange="setS('rest',this.value)">
   <label>תזכורת אחרי כמה ימים בלי אימון</label><input class="f" type="number" inputmode="numeric" value="${S.settings.remindDays}" onchange="setS('remindDays',this.value)">
   <label>התראות בדפדפן (${perm==="granted"?"פעיל":perm==="denied"?"חסום":perm==="unsupported"?"לא נתמך":"כבוי"})</label>
   <button onclick="askNotif()">הפעל התראות</button>
   <div class="mute" style="margin-top:8px">התזכורת מופיעה במסך הבית, ובהתראה כשפותחים את האפליקציה אחרי הפסקה.</div></div>
  <div class="card"><h2>התוכנית</h2><div class="row"><button class="grow" onclick="go('program')">ערוך תוכנית</button><button class="grow" onclick="resetProgram()">בחר תבנית מחדש</button></div></div>
  <div class="card"><h2>שיתוף</h2><div class="mute" style="margin-bottom:8px">שלח את האפליקציה לחבר. כל אחד בונה תוכנית משלו, והנתונים נשמרים רק אצלו.</div><button onclick="shareApp()">שתף את NotFat</button></div>
  <div class="card"><h2>גיבוי נתונים</h2><div class="mute" style="margin-bottom:8px">הנתונים נשמרים רק בטלפון. מומלץ לגבות מדי פעם.</div>
   <div class="row"><button class="grow" onclick="exportData()">ייצוא</button><button class="grow" onclick="$('imp').click()">ייבוא</button></div>
   <input id="imp" type="file" accept="application/json" hidden onchange="importData(this)"></div>`;
}
function resetProgram(){ if(confirm("להציג שוב את בחירת התוכנית? התוכנית הנוכחית תוחלף. ההיסטוריה נשמרת.")){ S.program=null; S.next=null; S.draft=null; timer=null; save(); view="home"; render(); } }
function shareApp(){ const u=location.href.split("#")[0]; if(navigator.share) navigator.share({title:"NotFat",text:"NotFat - מעקב אימונים",url:u}).catch(()=>{}); else { try{ navigator.clipboard.writeText(u); alert("הקישור הועתק:\n"+u); }catch{ prompt("העתק את הקישור:",u); } } }
function setS(k,v){ const n=parseInt(v,10); if(n>0){ S.settings[k]=n; save(); } }
function askNotif(){ if(!("Notification" in window)) return alert("הדפדפן לא תומך בהתראות"); Notification.requestPermission().then(render); }
function exportData(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download="notfat-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); }
function importData(inp){ const f=inp.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t);
  if(!Array.isArray(d.history)) throw 0; if(!confirm("לדרוס את הנתונים הנוכחיים?")) return; localStorage.setItem(KEY,JSON.stringify(d)); S=load(); save(); render(); alert("יובא בהצלחה"); }catch{ alert("קובץ לא תקין"); } }); }

/* ---------- תזכורת בפתיחה ---------- */
function maybeNotify(){
  const last=S.history[0]; if(!last||!S.program||!("Notification" in window)||Notification.permission!=="granted") return;
  if(daysSince(last.finished)>=S.settings.remindDays && daysSince(S.lastNotif||0)>=1){
    S.lastNotif=Date.now(); save();
    const d=dayById(S.next);
    new Notification("הגיע הזמן להתאמן 💪",{body:d?`האימון הבא: ${d.name}`:"",icon:"icon-192.png"});
  }
}

if (S.draft) view="workout";
render(); maybeNotify();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
